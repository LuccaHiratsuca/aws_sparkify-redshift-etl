; ---------------------------------------------------------------------------
; Sparkify Data Warehouse configuration
;
; Fill in the blanks BEFORE running iac.py / create_tables.py / etl.py.
; WARNING: do not commit real credentials. Keep a filled-in copy as
; dwh.local.cfg (git-ignored) and point the scripts at it with --config.
; ---------------------------------------------------------------------------

[AWS]
; IAM user credentials used only by iac.py to provision infrastructure.
KEY =
SECRET =

[DWH]
; Cluster shape used by iac.py when creating the Redshift cluster.
DWH_CLUSTER_TYPE       = multi-node
DWH_NUM_NODES          = 4
DWH_NODE_TYPE          = dc2.large
DWH_CLUSTER_IDENTIFIER = dwhCluster
DWH_IAM_ROLE_NAME      = dwhRole
REGION                 = us-west-2

[CLUSTER]
; Populated automatically by `python iac.py create` (HOST), or by hand.
HOST        =
DB_NAME     = dev
DB_USER     = dwhadmin
DB_PASSWORD =
DB_PORT     = 5439

[IAM_ROLE]
; Role that grants Redshift read-only access to S3. Written by iac.py create.
ARN =

[S3]
LOG_DATA      = s3://udacity-dend/log_data
LOG_JSONPATH  = s3://udacity-dend/log_json_path.json
SONG_DATA     = s3://udacity-dend/song_data
